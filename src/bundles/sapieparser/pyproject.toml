[project]
name = "lfx-sapieparser"
version = "0.1.0"
description = "Sapie HWP/HWPX parsing components as a standalone Langflow Extension Bundle."
readme = "README.md"
requires-python = ">=3.10,<3.15"
license = { text = "MIT" }
authors = [
    { name = "Sangmoon Jeon", email = "jeonsangmoon7540@gmail.com" },
]
keywords = ["langflow", "lfx", "extension", "bundle", "hwp", "hwpx", "sapie"]

# lfx is floored at the current major.minor line and capped below the next lfx
# major so the bundle resolves a compatible lfx; fine-grained BUNDLE_API
# compatibility is enforced separately via extension.json's
# "lfx": {"compat": [...]} contract. httpx/defusedxml are lfx dependencies as
# well, but the components import them directly so they are declared here.
dependencies = [
    "lfx>=1.10.0.dev0,<2.0.0",
    "httpx>=0.24.0,<1.0.0",
    "defusedxml>=0.7.1,<1.0.0",
]

[project.urls]
Homepage = "https://github.com/sangmoonjeon/hwpparser"

[project.entry-points."langflow.extensions"]
lfx-sapieparser = "lfx_sapieparser"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lfx_sapieparser"]
include = ["src/lfx_sapieparser/extension.json", "src/lfx_sapieparser/components/**/*.py"]

[tool.hatch.build.targets.sdist]
include = [
    "src/lfx_sapieparser",
    "extension.json",
    "README.md",
    "pyproject.toml",
]
